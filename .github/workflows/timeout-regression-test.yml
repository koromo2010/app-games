name: Timeout regression test

on:
  push:
    branches: [develop]
    paths:
      - packages/game-sdk/src/modules/timeout.ts
      - packages/game-sdk/src/runtime.ts
      - packages/game-sdk/src/index.ts
      - tests/game-sdk-timeout-regression.test.ts
      - .github/workflows/timeout-regression-test.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:runtime-packages
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/game-sdk-timeout-regression.test.ts
