name: Apply GameSdkFrame split

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/apply-game-sdk-frame-split.yml"
      - "scripts/game-sdk-frame-split.payload.*"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract staged payload
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile

          root = pathlib.Path(".").resolve()
          encoded = "".join(
              pathlib.Path(f"scripts/game-sdk-frame-split.payload.{index:02d}").read_text().strip()
              for index in range(4)
          )
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "16bca9e402c0465b8e9d61f5394c9f1aeac34a04099c2a03b138a3e4283a8439"
          if digest != expected:
              raise SystemExit(f"payload sha mismatch: {digest}")

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as payload:
              members = payload.getmembers()
              for member in members:
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are not allowed: {member.name}")
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe path: {member.name}")
              for member in members:
                  payload.extract(member, root)
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - run: npm run build
      - name: Commit applied split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Split GameSdkFrame into focused modules"
          git push origin HEAD:develop
