name: Apply DEBUG dummy timeout runtime fix

on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-dummy-timeout-runtime-fix.mjs
      - .github/workflows/apply-dummy-timeout-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-dummy-timeout-runtime-fix.mjs
      - name: Commit runtime fix
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-sdk/src/runtime.ts
          git commit -m "Fix DEBUG dummy timeout exemption by room player state"
          git push origin develop
