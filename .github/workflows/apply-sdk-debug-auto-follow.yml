name: Apply SDK DEBUG auto-follow

on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-sdk-debug-auto-follow-v3.mjs
      - .github/workflows/apply-sdk-debug-auto-follow.yml
  pull_request:
    branches: [develop]
    paths:
      - scripts/apply-sdk-debug-auto-follow-v3.mjs
      - .github/workflows/apply-sdk-debug-auto-follow.yml
      - .github/sdk-debug-auto-follow-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply auto-follow implementation
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-sdk-debug-auto-follow-v3.mjs 2>&1 | tee "$RUNNER_TEMP/sdk-debug-auto-follow.log"
      - name: Build SDK package
        run: npm run build:sdk-package
      - name: Run focused tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/game-sdk-debug-control-target.test.ts tests/game-sdk-debug-command-dispatch.test.ts
      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          {
            npm run verify
            npm run build
          } 2>&1 | tee "$RUNNER_TEMP/sdk-debug-auto-follow-verify.log"
      - name: Commit implementation
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/GameSdkFrame.tsx app/components/GameSdkShellHeader.tsx app/hooks/use-game-sdk-debug-control-target.ts lib/game-sdk-debug-control-target.ts tests/game-sdk-debug-control-target.test.ts
          git commit -m "Add SDK DEBUG auto-follow"
          git push origin HEAD:develop
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-debug-auto-follow-diagnostics
          path: |
            ${{ runner.temp }}/sdk-debug-auto-follow.log
            ${{ runner.temp }}/sdk-debug-auto-follow-verify.log
          if-no-files-found: warn
