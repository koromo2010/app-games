name: Verify SDK DEBUG auto-follow

on:
  push:
    branches: [develop]
    paths:
      - scripts/cleanup-sdk-debug-auto-follow.mjs
      - .github/workflows/apply-sdk-debug-auto-follow.yml
  pull_request:
    branches: [develop]
    paths:
      - scripts/cleanup-sdk-debug-auto-follow.mjs
      - .github/workflows/apply-sdk-debug-auto-follow.yml
      - .github/sdk-debug-auto-follow-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clean auto-follow implementation
        run: node scripts/cleanup-sdk-debug-auto-follow.mjs
      - name: Build SDK package
        run: npm run build:sdk-package
      - name: Run focused tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/game-sdk-debug-control-target.test.ts tests/game-sdk-debug-command-dispatch.test.ts
      - name: Verify and build
        run: |
          npm run verify
          npm run build
      - name: Commit cleanup
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/GameSdkFrame.tsx
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
          else
            git commit -m "Clean SDK DEBUG auto-follow effect"
            git push origin HEAD:develop
          fi
