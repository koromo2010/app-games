name: Redis consolidation verify

on:
  push:
    branches:
      - agent/redis-consolidation
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: redis-consolidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Redis and build-gate focused tests
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --experimental-strip-types --test
          tests/redis-store-config.test.ts
          tests/redis-consolidation-keys.test.ts
          tests/redis-migration-safety-contract.test.ts
          tests/redis-consolidation-policy.test.ts
          tests/game-sdk-room-watch-policy.test.ts
          tests/vercel-build-impact.test.ts

  repository-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  platform-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  sdk-portal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:sdk

  sdk-preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:sdk-preview
