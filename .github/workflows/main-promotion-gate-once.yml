name: Main Promotion Gate Once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/main-promotion-gate-once.yml
  pull_request:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-promotion-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout develop with full history
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run promotion gate with full verification
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Git status after npm ci:"
            git status --short
            echo
            node scripts/check-main-promotion-gate.mjs --execute
          } 2>&1 | tee main-promotion-gate.log

      - name: Upload promotion gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-promotion-gate-diagnostics
          path: |
            main-promotion-gate.log
            main-promotion-gate-report.json
          if-no-files-found: warn
