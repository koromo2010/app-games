name: Apply preview runtime pinning fix

on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-preview-runtime-pinning-fix.mjs
      - .github/workflows/apply-preview-runtime-pinning-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-preview-runtime-pinning-fix.mjs
      - name: Commit runtime pinning fix
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/api/sdk-preview/[creatorSlug]/games/[gameId]/rooms/route.ts'
          git commit -m "Pin active rooms to their stored runtime contract"
          git push origin develop
