name: SDK watcher recovery

on:
  push:
    branches:
      - agent/watcher-recovery
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: watcher-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watcher and build-gate tests
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --experimental-strip-types --test
          tests/game-sdk-room-watch-policy.test.ts
          tests/vercel-build-impact.test.ts

  platform-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
