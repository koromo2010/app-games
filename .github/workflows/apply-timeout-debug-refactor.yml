name: Apply timeout debug refactor

on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-timeout-debug-refactor.mjs
      - .github/workflows/apply-timeout-debug-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused source changes
        run: node scripts/apply-timeout-debug-refactor.mjs
      - name: Commit generated source diff
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-sdk/src/runtime.ts packages/game-sdk/src/index.ts
          git commit -m "Fix timeout state for rematch and DEBUG play"
          git push origin develop
