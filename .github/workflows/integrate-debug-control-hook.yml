name: Integrate debug control hook

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Add temporary debug hook integrator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply minimal GameSdkFrame integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/components/GameSdkFrame.tsx')
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              'import { useGameSdkActiveRoomRestore } from "@/app/hooks/use-game-sdk-active-room-restore";\n',
              'import { useGameSdkActiveRoomRestore } from "@/app/hooks/use-game-sdk-active-room-restore";\n'
              'import { useGameSdkDebugControlTarget } from "@/app/hooks/use-game-sdk-debug-control-target";\n',
          )

          replace_once(
              '  const debugViewerRef = useRef<DebugViewer>("self");\n'
              '  const debugActorSeatRef = useRef<number | null>(null);\n',
              '',
          )
          replace_once(
              '  const [debugViewer, setDebugViewer] = useState<DebugViewer>("self");\n'
              '  const [debugActorSeat, setDebugActorSeat] = useState<number | null>(null);\n',
              '',
          )

          old_post_room = '''  const postRoom = useCallback((next: PackageRoom | null) => {
    const viewer = debugViewerRef.current;
    if (!next || viewer === "self") {
      postRoomSnapshot(next);
      return;
    }
    void runtime.readRoomAsDebugViewer(next.code, viewer).then((debugRoom) => {
      if (
        debugViewerRef.current === viewer
        && roomRef.current?.code === next.code
        && roomRef.current.revision === next.revision
      ) {
        postRoomSnapshot(debugRoom);
      }
    }).catch(() => {
      if (debugViewerRef.current !== viewer) return;
      debugViewerRef.current = "self";
      setDebugViewer("self");
      postRoomSnapshot(roomRef.current);
      setMessage("選択した閲覧視点を取得できないため、本人視点へ戻しました。");
    });
  }, [postRoomSnapshot, runtime]);
'''
          new_post_room = '''  const {
    actorSeat: debugActorSeat,
    isSwitching: debugTargetSwitching,
    postRoom,
    reset: resetDebugControl,
    selectTarget: selectDebugTarget,
    viewer: debugViewer,
    wrapCommand: wrapDebugCommand,
  } = useGameSdkDebugControlTarget<PackageRoom>({
    getRoom: () => roomRef.current,
    readRoomAsDebugViewer: (code, viewer) => (
      runtime.readRoomAsDebugViewer(code, viewer)
    ),
    postRoomSnapshot,
    onViewerError: () => {
      setMessage("選択した閲覧視点を取得できないため、本人視点へ戻しました。");
    },
  });
'''
          replace_once(old_post_room, new_post_room)

          replace_once(
              '''  const commitRoom = useCallback((next: PackageRoom | null) => {
    if (next?.phase !== "playing" && debugActorSeatRef.current !== null) {
      debugActorSeatRef.current = null;
      setDebugActorSeat(null);
    }
    roomRef.current = next;
    setRoom(next);
    postRoom(next);
  }, [postRoom]);
''',
              '''  const commitRoom = useCallback((next: PackageRoom | null) => {
    roomRef.current = next;
    setRoom(next);
    postRoom(next);
  }, [postRoom]);

  useEffect(() => {
    if (room?.phase !== "playing" && debugViewer !== "self") {
      resetDebugControl();
    }
  }, [debugViewer, resetDebugControl, room?.phase]);
''',
          )

          replace_once(
              '''    if (!next || (previousCode && previousCode !== next.code)) {
      debugViewerRef.current = "self";
      setDebugViewer("self");
      debugActorSeatRef.current = null;
      setDebugActorSeat(null);
    }
''',
              '''    if (!next || (previousCode && previousCode !== next.code)) {
      resetDebugControl();
    }
''',
          )
          replace_once(
              '  }, [acceptIncomingRoom, commitRoom, handleRuntimeError, runtime]);\n',
              '  }, [acceptIncomingRoom, commitRoom, handleRuntimeError, resetDebugControl, runtime]);\n',
          )

          replace_once(
              '''  const sendPackageCommand = useCallback((command: SafeCommand) => {
    const actorSeat = debugActorSeatRef.current;
    return send(
      actorSeat !== null && !command.type.startsWith("room/")
        ? {
            type: "room/debug-act-as-dummy",
            seat: actorSeat,
            command,
          }
        : command,
    );
  }, [send]);

  const selectDebugViewer = useCallback((viewer: DebugViewer) => {
    debugViewerRef.current = viewer;
    setDebugViewer(viewer);
    postRoom(roomRef.current);
  }, [postRoom]);

  const selectDebugActor = useCallback((seat: number | null) => {
    if (seat !== null) {
      const target = roomRef.current?.view.common.players[seat];
      if (!target?.isDummy) {
        setMessage("操作対象にはダミープレイヤーだけを選択できます。");
        return;
      }
    }
    debugActorSeatRef.current = seat;
    setDebugActorSeat(seat);
    selectDebugViewer(seat ?? "self");
  }, [selectDebugViewer]);
''',
              '''  const sendPackageCommand = useCallback(async (command: SafeCommand) => (
    send(wrapDebugCommand(command) as SafeCommand)
  ), [send, wrapDebugCommand]);

  const selectDebugViewer = useCallback((viewer: DebugViewer) => {
    selectDebugTarget(
      viewer === "self"
        ? { mode: "self" }
        : viewer === "spectator"
          ? { mode: "spectator" }
          : { mode: "viewer", seat: viewer },
    );
  }, [selectDebugTarget]);

  const selectDebugActor = useCallback((seat: number | null) => {
    if (seat !== null) {
      const target = roomRef.current?.view.common.players[seat];
      if (!target?.isDummy) {
        setMessage("操作対象にはダミープレイヤーだけを選択できます。");
        return;
      }
    }
    selectDebugTarget(
      seat === null ? { mode: "self" } : { mode: "dummy", seat },
    );
  }, [selectDebugTarget]);
''',
          )

          replace_once(
              '''          error: error instanceof GameSdkHttpClientRuntimeError
            ? error.code
            : "GAME_SDK_COMMAND_REJECTED",
''',
              '''          error: error instanceof GameSdkHttpClientRuntimeError
            ? error.code
            : error instanceof Error && /^[A-Z][A-Z0-9_]{1,79}$/.test(error.message)
              ? error.message
              : "GAME_SDK_COMMAND_REJECTED",
''',
          )

          replace_once(
              '          isSubmitting: pending,\n',
              '          isSubmitting: pending || debugTargetSwitching,\n',
          )
          replace_once(
              '          statusMessage: message,\n',
              '          statusMessage: debugTargetSwitching ? "操作対象を切り替えています…" : message,\n',
          )

          path.write_text(source)
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/components/GameSdkFrame.tsx
          git commit -m "Integrate atomic debug target switching"
          git push origin develop
